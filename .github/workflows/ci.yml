name: ci
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test tests/VelvetChess.Core.Tests/VelvetChess.Core.Tests.csproj -c Release
      - run: pwsh -NoProfile -File scripts/Test-RuStoreReadiness.ps1 -AllowOwnerPlaceholders -SkipTests

  android-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - run: dotnet workload install maui-android
      - run: dotnet build src/VelvetChess.App/VelvetChess.App.csproj -t:InstallAndroidDependencies -f net9.0-android -p:AcceptAndroidSdkLicenses=True
      - run: dotnet build src/VelvetChess.App/VelvetChess.App.csproj -f net9.0-android -c Release
